<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thistlevane</title>
    <style>
      /*
        MMORPG HUD. Everything here is chrome drawn by the browser on top of the
        Phaser canvas; the world itself never scales with it. Colours follow
        docs/ART_BIBLE.md (Deep Bark outlines, warm gold accents, cool shadows).
      */
      :root {
        --ui-scale: 1;
        --ink: #e8dcc8;
        --ink-dim: #8a7e68;
        --gold: #d4b060;
        --panel: rgba(14, 10, 22, 0.92);
        --panel-edge: #4a3c2e;
        --slot: #0a0614;
        --slot-edge: #3a302a;
      }

      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1a22; }
      #game canvas { display: block; image-rendering: pixelated; }

      #game-ui {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 10;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        user-select: none;
        font-size: calc(12px * var(--ui-scale));
      }
      /* Only the panels take pointer events; the world stays clickable between them. */
      #game-ui > * { pointer-events: auto; }
      #game-ui .panel {
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        box-shadow: inset 0 0 0 1px rgba(200, 160, 80, 0.1), 0 2px 8px rgba(0, 0, 0, 0.6);
      }

      /* ── Unit frames (player + target) ── */
      .unit-frame {
        display: flex; gap: calc(6px * var(--ui-scale));
        padding: calc(5px * var(--ui-scale));
      }
      .uf-portrait {
        width: calc(42px * var(--ui-scale)); height: calc(42px * var(--ui-scale));
        background-color: #0a0614;
        border: 2px solid #5a4a38;
        box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
        image-rendering: pixelated;
        background-repeat: no-repeat;
        flex-shrink: 0;
      }
      .uf-info {
        flex: 1; display: flex; flex-direction: column;
        justify-content: center; gap: calc(2px * var(--ui-scale)); min-width: 0;
      }
      .uf-header { display: flex; align-items: baseline; gap: calc(6px * var(--ui-scale)); line-height: 1.2; }
      .uf-name {
        font-size: calc(11px * var(--ui-scale)); font-weight: 600;
        color: var(--gold);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .uf-level {
        font: calc(9px * var(--ui-scale)) / 1 ui-monospace, Consolas, monospace;
        color: var(--ink-dim); flex-shrink: 0;
      }
      .uf-title {
        font-size: calc(9px * var(--ui-scale)); color: #7a6e58;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;
      }

      /* ── Resource bars ── */
      .resource-bar {
        height: calc(12px * var(--ui-scale));
        background: #0c0a14;
        border: 1px solid #2a2424;
        position: relative; overflow: hidden;
      }
      .resource-bar.thin { height: calc(9px * var(--ui-scale)); }
      .resource-bar.sliver { height: calc(5px * var(--ui-scale)); }
      .bar-fill { height: 100%; width: 100%; transition: width 0.25s ease-out; }
      /* A paler ghost bar drains a beat later, so a hit reads as damage taken. */
      .bar-ghost {
        position: absolute; top: 0; left: 0; height: 100%;
        background: rgba(255, 220, 160, 0.35);
        transition: width 0.45s ease-out 0.15s;
      }
      .bar-text {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font: calc(8px * var(--ui-scale)) / 1 ui-monospace, Consolas, monospace;
        color: #fff;
        text-shadow: 0 0 3px rgba(0, 0, 0, 1), 0 1px 1px rgba(0, 0, 0, 0.9);
        letter-spacing: 0.5px;
      }
      .hp-bar .bar-fill { background: linear-gradient(180deg, #5cd048 0%, #38a830 50%, #287820 100%); }
      .mp-bar .bar-fill { background: linear-gradient(180deg, #5888e8 0%, #3860c8 50%, #1e40a0 100%); }
      .xp-bar .bar-fill { background: linear-gradient(180deg, #c8a050 0%, #a08030 50%, #786020 100%); }
      .hp-bar.hostile .bar-fill { background: linear-gradient(180deg, #e06050 0%, #b83828 50%, #802018 100%); }

      /* ── Frame placement ── */
      #player-frame { position: absolute; top: 8px; left: 8px; width: calc(196px * var(--ui-scale)); }
      #target-frame { position: absolute; top: 8px; left: calc(16px + 196px * var(--ui-scale)); width: calc(186px * var(--ui-scale)); }
      #target-frame.dead { opacity: 0.55; filter: grayscale(0.6); }

      /* ── Hotbar ── */
      #skill-bar {
        position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
        display: flex; gap: calc(3px * var(--ui-scale)); padding: calc(3px * var(--ui-scale));
      }
      .skill-slot {
        width: calc(36px * var(--ui-scale)); height: calc(36px * var(--ui-scale));
        background: var(--slot);
        border: 1px solid var(--slot-edge);
        position: relative; cursor: pointer;
        transition: border-color 0.15s;
      }
      .skill-slot .slot-icon {
        position: absolute; inset: 0;
        background-image: url(/ui/icons.png);
        background-repeat: no-repeat;
        /* 6 cells of 16px drawn at 2×: 192px wide, each cell 32px inside a 36px slot. */
        background-size: calc(192px * var(--ui-scale)) calc(32px * var(--ui-scale));
        background-position-y: calc(1px * var(--ui-scale));
        image-rendering: pixelated;
      }
      .skill-slot:hover { border-color: #8a7a60; }
      .skill-slot.ready { border-color: #6a5a3c; }
      .skill-slot.ready:hover { border-color: var(--gold); }
      .skill-slot.active { border-color: var(--gold); box-shadow: inset 0 0 8px rgba(200, 160, 80, 0.45); }
      .skill-slot.locked .slot-icon { filter: grayscale(1) brightness(0.45); }
      .skill-slot .keybind {
        position: absolute; bottom: 0; right: calc(2px * var(--ui-scale));
        font: calc(8px * var(--ui-scale)) / 1.4 ui-monospace, Consolas, monospace;
        color: #6a5e48; text-shadow: 0 1px 2px #000;
      }
      /* Cooldown: a dark curtain that wipes downwards as the skill comes back. */
      .skill-slot .cooldown {
        position: absolute; left: 0; right: 0; top: 0;
        background: rgba(8, 6, 14, 0.72);
        border-bottom: 1px solid rgba(212, 176, 96, 0.5);
        height: 0%;
        pointer-events: none;
      }

      /* ── Status + hints ── */
      #status-overlay {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 10px 20px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        font: 13px/1.5 'Segoe UI', system-ui, sans-serif;
        color: var(--ink); text-align: center;
      }
      #status-overlay.bad { color: #ff9a8a; border-color: #6a2a2a; }
      #control-hint {
        position: absolute; bottom: calc(14px + 42px * var(--ui-scale)); left: 50%;
        transform: translateX(-50%);
        font: calc(9px * var(--ui-scale)) / 1.4 ui-monospace, Consolas, monospace;
        color: #6a6050; text-shadow: 0 1px 2px #000;
        white-space: nowrap; pointer-events: none;
      }
      #control-hint b { color: #9a8a68; font-weight: 600; }
      #map-guide {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: calc(320px * var(--ui-scale)); max-height: 70vh;
        padding: calc(10px * var(--ui-scale));
        overflow-y: auto;
        display: none;
      }
      #map-guide.open { display: block; }
      #map-guide h2 {
        margin: 0 0 calc(2px * var(--ui-scale)) 0;
        font-size: calc(13px * var(--ui-scale));
        color: var(--gold);
      }
      #map-guide .map-guide-hint {
        font: calc(9px * var(--ui-scale)) / 1 ui-monospace, Consolas, monospace;
        color: var(--ink-dim);
        margin-bottom: calc(8px * var(--ui-scale));
      }
      #map-guide .zone-entry {
        padding: calc(6px * var(--ui-scale)) 0;
        border-top: 1px solid var(--panel-edge);
      }
      #map-guide .zone-entry:first-of-type { border-top: none; }
      #map-guide .zone-name { font-weight: 600; color: var(--ink); }
      #map-guide .zone-entry.here .zone-name::after {
        content: ' (you are here)';
        color: var(--gold); font-weight: 400;
        font-size: calc(9px * var(--ui-scale));
      }
      #map-guide .zone-difficulty {
        font: calc(9px * var(--ui-scale)) / 1 ui-monospace, Consolas, monospace;
        color: var(--ink-dim);
        margin-left: calc(6px * var(--ui-scale));
      }
      #map-guide .zone-description {
        font-size: calc(10px * var(--ui-scale));
        color: #b0a488;
        margin: calc(2px * var(--ui-scale)) 0;
      }
      #map-guide .zone-portals {
        font-size: calc(9px * var(--ui-scale));
        color: var(--ink-dim);
        margin: calc(2px * var(--ui-scale)) 0 0 calc(10px * var(--ui-scale));
      }
      #minimap {
        position: absolute; top: 8px; right: 8px;
        width: calc(128px * var(--ui-scale)); height: calc(128px * var(--ui-scale));
      }
      #loading-screen {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: calc(260px * var(--ui-scale));
        padding: calc(14px * var(--ui-scale));
        text-align: center;
      }
      #loading-screen .loading-title {
        font-size: calc(13px * var(--ui-scale));
        color: var(--gold);
        margin-bottom: calc(8px * var(--ui-scale));
      }
      #loading-screen .loading-bar-track {
        height: calc(10px * var(--ui-scale));
        background: var(--slot);
        border: 1px solid var(--slot-edge);
        overflow: hidden;
      }
      #loading-screen .loading-bar-fill {
        height: 100%; width: 0%;
        background: linear-gradient(180deg, #d4b060 0%, #a08030 50%, #786020 100%);
        transition: width 0.15s ease-out;
      }
      #loading-screen .loading-text {
        margin-top: calc(6px * var(--ui-scale));
        font: calc(9px * var(--ui-scale)) / 1 ui-monospace, Consolas, monospace;
        color: var(--ink-dim);
        white-space: pre-line;
      }
      #loading-screen.bad { border-color: #6a2a2a; }
      #loading-screen.bad .loading-title { color: #ff9a8a; }
      #dev-overlay {
        position: absolute; bottom: 6px; right: 8px;
        padding: 3px 6px;
        background: rgba(14, 10, 22, 0.65);
        border: 1px solid #2a2224;
        font: 9px/1.4 ui-monospace, Consolas, monospace;
        color: #5a5040; white-space: pre; text-align: right;
      }

      /* Small windows: shrink the chrome rather than letting it eat the view. */
      @media (max-width: 900px) { :root { --ui-scale: 0.85; } }
      @media (max-width: 680px) {
        :root { --ui-scale: 0.72; }
        #target-frame { top: calc(14px + 54px * var(--ui-scale)); left: 8px; }
        #control-hint { display: none; }
      }
      @media (max-height: 460px) { #control-hint { display: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="game-ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
