<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thistlevane</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1a22;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(20, 18, 28, 0.75);
        color: #efe6d2;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        pointer-events: none;
        white-space: pre;
      }
      #hud.bad {
        color: #ff9a8a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
